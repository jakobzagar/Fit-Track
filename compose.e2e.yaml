name: fit-track-e2e

services:
  database:
    image: postgres:17.11-alpine3.24@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: fit_track_e2e
      POSTGRES_PASSWORD: fit_track_e2e_password
      POSTGRES_DB: fit_track_e2e_test
    ports:
      - "127.0.0.1:${E2E_DATABASE_PORT:-15433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
    restart: "no"
