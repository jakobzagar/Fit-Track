name: fit-track-e2e

services:
  database:
    image: postgres:17.12-alpine3.24@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    environment:
      POSTGRES_USER: fit_track_e2e
      POSTGRES_PASSWORD: fit_track_e2e_password
      POSTGRES_DB: fit_track_e2e_test
    ports:
      - "127.0.0.1:${E2E_DATABASE_PORT:-15433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
    restart: "no"
