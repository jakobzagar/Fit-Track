name: fit-track-e2e

services:
  database:
    image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: fit_track_e2e
      POSTGRES_PASSWORD: fit_track_e2e_password
      POSTGRES_DB: fit_track_e2e_test
    ports:
      - "127.0.0.1:${E2E_DATABASE_PORT:-15433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
    restart: "no"
