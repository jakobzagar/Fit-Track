AWSTemplateFormatVersion: "2010-09-09"

Description: FitTrack ECS backend service, migration task, IAM roles, runtime secrets, and task networking.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod

  BackendDesiredCount:
    Type: Number
    Default: 2
    MinValue: 0
    Description: Number of backend tasks; use zero for bootstrap and at least two for multi-AZ operation.
  BackendHealthCheckGracePeriodSeconds:
    Type: Number
    Default: 60
    MinValue: 0
    MaxValue: 300
    Description: Startup grace period before ECS acts on unhealthy backend health checks.

  BackendImageDigest:
    Type: String
    Description: Verified backend image digest from the ECR backend repository.
    AllowedPattern: "^sha256:[a-f0-9]{64}$"
  BackendCpu:
    Type: Number
    Default: 256
    AllowedValues: [256, 512, 1024]
    Description: CPU units allocated to the backend task (1024 units equal one vCPU).
  BackendMemory:
    Type: Number
    Default: 512
    AllowedValues: [512, 1024, 2048]
    Description: Hard memory limit for the backend task in MiB.
  ClientOrigin:
    Type: String
    Description: HTTPS frontend origin without a path, used for credentialed CORS and CSRF checks.
    AllowedPattern: "^https://[^/\\s?#]+$"
  TrustProxyHops:
    Type: Number
    Default: 2
    AllowedValues: [0, 1, 2, 3]
    Description: Trusted proxy hops; two for the planned CloudFront to ALB to backend path.

  MigrationImageDigest:
    Type: String
    Description: Verified migration image digest from the ECR migration repository.
    AllowedPattern: "^sha256:[a-f0-9]{64}$"
  MigrationCpu:
    Type: Number
    Default: 256
    AllowedValues: [256, 512, 1024]
    Description: CPU units reserved for the migration task (1024 units equal one vCPU).
  MigrationMemory:
    Type: Number
    Default: 512
    AllowedValues: [512, 1024, 2048]
    Description: Hard memory limit for the migration task in MiB.

Rules:
  BackendMultiAzDesiredCount:
    Assertions:
      - Assert: !Not [!Equals [!Ref BackendDesiredCount, "1"]]
        AssertDescription: Use zero backend tasks for bootstrap or at least two for multi-AZ operation.

Resources:
  BackendSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub fit-track/${Environment}/backend
      Description: FitTrack backend runtime secrets.
      Tags:
        - Key: Name
          Value: !Sub fit-track-${Environment}-backend-secret-eu-central-1
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: fit-track
        - Key: Component
          Value: service

  MigrationSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub fit-track/${Environment}/migration
      Description: FitTrack migration database connection secret.
      Tags:
        - Key: Name
          Value: !Sub fit-track-${Environment}-migration-secret-eu-central-1
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: fit-track
        - Key: Component
          Value: service

  BackendTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub fit-track-${Environment}-backend-task-execution-role-eu-central-1
      Description: ECS execution role scoped to backend image pulls, backend logs, and backend secret retrieval.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub fit-track-${Environment}-backend-task-execution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuthentication
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PullBackendImage
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource:
                  Fn::ImportValue: !Sub "fit-track-${Environment}-ecr-EcrBackendRepositoryArn"
              - Sid: WriteBackendLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::ImportValue: !Sub "fit-track-${Environment}-logs-BackendLogGroupArn"
              - Sid: ReadBackendSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref BackendSecret
      Tags:
        - Key: Name
          Value: !Sub fit-track-${Environment}-backend-task-execution-role-eu-central-1
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: fit-track
        - Key: Component
          Value: service

  MigrationTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub fit-track-${Environment}-migration-task-execution-role-eu-central-1
      Description: ECS execution role scoped to migration image pulls, migration logs, and database secret retrieval.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub fit-track-${Environment}-migration-task-execution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuthentication
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PullMigrationImage
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource:
                  Fn::ImportValue: !Sub "fit-track-${Environment}-ecr-EcrMigrationRepositoryArn"
              - Sid: WriteMigrationLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::ImportValue: !Sub "fit-track-${Environment}-logs-MigrationLogGroupArn"
              - Sid: ReadMigrationDatabaseSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref MigrationSecret
      Tags:
        - Key: Name
          Value: !Sub fit-track-${Environment}-migration-task-execution-role-eu-central-1
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: fit-track
        - Key: Component
          Value: service

  MigrationTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities:
        - EC2
      ExecutionRoleArn: !GetAtt MigrationTaskExecutionRole.Arn
      Cpu: !Ref MigrationCpu
      Memory: !Ref MigrationMemory
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: migration
          Image:
            Fn::Sub:
              - "${RepositoryUri}@${MigrationImageDigest}"
              - RepositoryUri:
                  Fn::ImportValue: !Sub "fit-track-${Environment}-ecr-EcrMigrationRepositoryUri"
          Essential: true
          StopTimeout: 120
          LinuxParameters:
            InitProcessEnabled: true
          Environment:
            - Name: NODE_ENV
              Value: production
          Secrets:
            - Name: DATABASE_URL
              ValueFrom: !Sub "${MigrationSecret}:DATABASE_URL::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub "fit-track-${Environment}-logs-MigrationLogGroupName"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: migration
              mode: blocking
      Family: !Sub fit-track-${Environment}-migration-eu-central-1
      NetworkMode: awsvpc
      Tags:
        - Key: Name
          Value: !Sub fit-track-${Environment}-migration-task-definition-eu-central-1
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: fit-track
        - Key: Component
          Value: service

  BackendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities:
        - EC2
      ExecutionRoleArn: !GetAtt BackendTaskExecutionRole.Arn
      Cpu: !Ref BackendCpu
      Memory: !Ref BackendMemory
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: backend
          Image:
            Fn::Sub:
              - "${RepositoryUri}@${BackendImageDigest}"
              - RepositoryUri:
                  Fn::ImportValue: !Sub "fit-track-${Environment}-ecr-EcrBackendRepositoryUri"
          Essential: true
          StopTimeout: 30
          LinuxParameters:
            InitProcessEnabled: true
          PortMappings:
            - Name: backend-http
              ContainerPort: 3001
              Protocol: tcp
              AppProtocol: http
          HealthCheck:
            Command:
              - CMD
              - node
              - -e
              - "fetch('http://127.0.0.1:3001/api/health/live').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
            Interval: 30
            Timeout: 5
            StartPeriod: 10
            Retries: 3
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PORT
              Value: "3001"
            - Name: CLIENT_ORIGIN
              Value: !Ref ClientOrigin
            - Name: TRUST_PROXY_HOPS
              Value: !Sub "${TrustProxyHops}"
            - Name: LOG_LEVEL
              Value: info
          Secrets:
            - Name: DATABASE_URL
              ValueFrom: !Sub "${BackendSecret}:DATABASE_URL::"
            - Name: JWT_SECRET
              ValueFrom: !Sub "${BackendSecret}:JWT_SECRET::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub "fit-track-${Environment}-logs-BackendLogGroupName"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend
              mode: non-blocking
              max-buffer-size: 1m
      Family: !Sub fit-track-${Environment}-backend-eu-central-1
      NetworkMode: awsvpc
      Tags:
        - Key: Name
          Value: !Sub fit-track-${Environment}-backend-task-definition-eu-central-1
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: fit-track
        - Key: Component
          Value: service

  BackendTaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Backend task HTTP access from the application load balancer.
      VpcId:
        Fn::ImportValue: !Sub "fit-track-${Environment}-network-VpcId"
      SecurityGroupEgress:
        - Description: Allow all outbound IPv4 traffic.
          IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub fit-track-${Environment}-backend-task-sg-eu-central-1
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: fit-track
        - Key: Component
          Value: service

  BackendTaskSecurityGroupIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Backend HTTP and readiness health checks from the ALB.
      GroupId: !GetAtt BackendTaskSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 3001
      ToPort: 3001
      SourceSecurityGroupId:
        Fn::ImportValue: !Sub "fit-track-${Environment}-ingress-AlbSecurityGroupId"

  BackendService:
    Type: AWS::ECS::Service
    DependsOn:
      - BackendTaskSecurityGroupIngressFromAlb
    Properties:
      ServiceName: !Sub fit-track-${Environment}-backend-service-eu-central-1
      Cluster:
        Fn::ImportValue: !Sub "fit-track-${Environment}-compute-EcsClusterArn"
      TaskDefinition: !Ref BackendTaskDefinition
      CapacityProviderStrategy:
        - CapacityProvider:
            Fn::ImportValue: !Sub "fit-track-${Environment}-compute-EcsCapacityProviderName"
          Weight: 1
      DesiredCount: !Ref BackendDesiredCount
      SchedulingStrategy: REPLICA
      AvailabilityZoneRebalancing: ENABLED
      PlacementStrategies:
        - Type: spread
          Field: attribute:ecs.availability-zone
        - Type: binpack
          Field: memory
      DeploymentController:
        Type: ECS
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 150
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      HealthCheckGracePeriodSeconds: !Ref BackendHealthCheckGracePeriodSeconds
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - Fn::ImportValue: !Sub "fit-track-${Environment}-network-AppSubnetAz1Id"
            - Fn::ImportValue: !Sub "fit-track-${Environment}-network-AppSubnetAz2Id"
          SecurityGroups:
            - !GetAtt BackendTaskSecurityGroup.GroupId
      LoadBalancers:
        - TargetGroupArn:
            Fn::ImportValue: !Sub "fit-track-${Environment}-ingress-BackendTargetGroupArn"
          ContainerName: backend
          ContainerPort: 3001
      Tags:
        - Key: Name
          Value: !Sub fit-track-${Environment}-backend-service-eu-central-1
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: fit-track
        - Key: Component
          Value: service

Outputs:
  BackendServiceArn:
    Description: ARN of the backend ECS service.
    Value: !Ref BackendService
    Export:
      Name: !Sub "fit-track-${Environment}-service-BackendServiceArn"
  BackendServiceName:
    Description: Name of the backend ECS service for deployments and operations.
    Value: !GetAtt BackendService.Name
    Export:
      Name: !Sub "fit-track-${Environment}-service-BackendServiceName"
  BackendTaskSecurityGroupId:
    Description: ID of the backend task security group for ECS service network configuration.
    Value: !GetAtt BackendTaskSecurityGroup.GroupId
  BackendSecretArn:
    Description: ARN of the backend runtime secret.
    Value: !Ref BackendSecret
  MigrationSecretArn:
    Description: ARN of the migration database connection secret.
    Value: !Ref MigrationSecret
  BackendTaskExecutionRoleArn:
    Description: ARN of the backend task execution role.
    Value: !GetAtt BackendTaskExecutionRole.Arn
  MigrationTaskExecutionRoleArn:
    Description: ARN of the migration task execution role.
    Value: !GetAtt MigrationTaskExecutionRole.Arn
  BackendTaskDefinitionArn:
    Description: ARN of the backend task definition for the ECS service.
    Value: !Ref BackendTaskDefinition
  MigrationTaskDefinitionArn:
    Description: ARN of the migration task definition for one-off ECS RunTask operations.
    Value: !Ref MigrationTaskDefinition
