AWSTemplateFormatVersion: "2010-09-09"

Description: FitTrack Application Load Balancer, HTTP listener, and backend target group.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod

Resources:
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub fit-track-${Environment}-alb-eu-central-1
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets:
        - Fn::ImportValue: !Sub "fit-track-${Environment}-network-PublicSubnetAz1Id"
        - Fn::ImportValue: !Sub "fit-track-${Environment}-network-PublicSubnetAz2Id"
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
        - Key: routing.http.desync_mitigation_mode
          Value: defensive
      Tags:
        - Key: Name
          Value: !Sub fit-track-${Environment}-alb-eu-central-1
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: fit-track
        - Key: Component
          Value: ingress

  AlbHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup

  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub fit-track-${Environment}-backend-tg
      VpcId:
        Fn::ImportValue: !Sub "fit-track-${Environment}-network-VpcId"
      TargetType: ip
      Protocol: HTTP
      Port: 3001
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: /api/health/ready
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: Name
          Value: !Sub fit-track-${Environment}-backend-tg-eu-central-1
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: fit-track
        - Key: Component
          Value: ingress

Outputs:
  AlbArn:
    Description: ARN of the Application Load Balancer.
    Value: !Ref Alb
    Export:
      Name: !Sub "${AWS::StackName}-AlbArn"
  AlbDnsName:
    Description: ALB DNS name for the CloudFront HTTP origin.
    Value: !GetAtt Alb.DNSName
    Export:
      Name: !Sub "${AWS::StackName}-AlbDnsName"
  BackendTargetGroupArn:
    Description: Backend IP target group ARN for the ECS service load balancer configuration.
    Value: !Ref BackendTargetGroup
    Export:
      Name: !Sub "${AWS::StackName}-BackendTargetGroupArn"
  AlbHttpListenerArn:
    Description: ARN of the HTTP listener forwarding to the backend target group.
    Value: !Ref AlbHttpListener
    Export:
      Name: !Sub "${AWS::StackName}-AlbHttpListenerArn"
