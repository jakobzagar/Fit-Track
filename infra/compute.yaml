AWSTemplateFormatVersion: "2010-09-09"

Description: FitTrack ECS cluster, EC2 capacity, and managed instance access.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod
  InstanceType:
    Type: String
    Description: EC2 instance type.
    Default: "t3.small"
    AllowedValues:
      - t3.small
      - t3.medium
  DesiredCapacity:
    Type: Number
    Default: 2
    MinValue: 2
    Description: Initial and minimum multi-AZ EC2 capacity for the ECS cluster.
  MaxSize:
    Type: Number
    Default: 3
    MinValue: 2
    Description: Maximum number of EC2 instances available to ECS capacity scaling.
  MinSize:
    Type: Number
    Default: 2
    MinValue: 2
    Description: Minimum number of EC2 instances available to ECS capacity scaling.
  EcsOptimizedAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ecs/optimized-ami/amazon-linux-2023/recommended/image_id
    Description: Recommended Amazon Linux 2023 ECS-optimized AMI ID from Parameter Store.

Resources:
  EcsInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub fit-track-${Environment}-ecs-instance-role-eu-central-1
      Description: EC2 instance role for ECS container management and Systems Manager access.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: !Sub fit-track-${Environment}-ecs-instance-role-eu-central-1
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: fit-track
        - Key: Component
          Value: compute

  EcsInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub fit-track-${Environment}-ecs-instance-profile-eu-central-1
      Roles:
        - !Ref EcsInstanceRole

  EcsInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS container instance network access in private application subnets.
      VpcId:
        Fn::ImportValue:
          Fn::Sub: "fit-track-${Environment}-network-VpcId"
      Tags:
        - Key: Name
          Value: !Sub fit-track-${Environment}-ecs-instance-sg-eu-central-1
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: fit-track
        - Key: Component
          Value: compute

  EndpointSecurityGroupIngressFromEcsInstances:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow ECS instances to connect to interface endpoints over HTTPS.
      GroupId:
        Fn::ImportValue:
          Fn::Sub: "fit-track-${Environment}-endpoints-InterfaceEndpointsSecurityGroupId"
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !GetAtt EcsInstanceSecurityGroup.GroupId

  Ec2InstanceLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub fit-track-${Environment}-ecs-launch-template-eu-central-1
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
            - Key: Name
              Value: !Sub fit-track-${Environment}-ecs-launch-template-eu-central-1
            - Key: Environment
              Value: !Ref Environment
            - Key: Project
              Value: fit-track
            - Key: Component
              Value: compute
      LaunchTemplateData:
        ImageId: !Ref EcsOptimizedAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Name: !Ref EcsInstanceProfile
        SecurityGroupIds:
          - !Ref EcsInstanceSecurityGroup
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 30
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: volume
            Tags:
              - Key: Name
                Value: !Sub fit-track-${Environment}-ecs-root-volume-eu-central-1
              - Key: Environment
                Value: !Ref Environment
              - Key: Project
                Value: fit-track
              - Key: Component
                Value: compute
        UserData:
          Fn::Base64:
            Fn::Sub: |
              #!/bin/bash
              set -euo pipefail
              printf 'ECS_CLUSTER=%s\n' '${EcsCluster}' > /etc/ecs/ecs.config

  Ec2AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: EndpointSecurityGroupIngressFromEcsInstances
    Properties:
      AutoScalingGroupName: !Sub fit-track-${Environment}-ecs-asg-eu-central-1
      AvailabilityZoneDistribution:
        CapacityDistributionStrategy: balanced-best-effort
      DesiredCapacity: !Ref DesiredCapacity
      LaunchTemplate:
        LaunchTemplateId: !Ref Ec2InstanceLaunchTemplate
        Version: !GetAtt Ec2InstanceLaunchTemplate.LatestVersionNumber
      MaxSize: !Ref MaxSize
      MinSize: !Ref MinSize
      NewInstancesProtectedFromScaleIn: true
      TerminationPolicies:
        - OldestInstance
      Tags:
        - Key: Name
          Value: !Sub fit-track-${Environment}-ecs-instance-eu-central-1
          PropagateAtLaunch: true
        - Key: Environment
          Value: !Ref Environment
          PropagateAtLaunch: true
        - Key: Project
          Value: fit-track
          PropagateAtLaunch: true
        - Key: Component
          Value: compute
          PropagateAtLaunch: true
      VPCZoneIdentifier:
        - Fn::ImportValue:
            Fn::Sub: "fit-track-${Environment}-network-AppSubnetAz1Id"
        - Fn::ImportValue:
            Fn::Sub: "fit-track-${Environment}-network-AppSubnetAz2Id"
    UpdatePolicy:
      AutoScalingInstanceRefresh:
        Strategy: Rolling
        Preferences:
          MinHealthyPercentage: 100
          MaxHealthyPercentage: 150
          InstanceWarmup: 300
          ScaleInProtectedInstances: Refresh
          SkipMatching: true

  EcsCapacityProvider:
    Type: AWS::ECS::CapacityProvider
    Properties:
      Name: !Sub fit-track-${Environment}-ecs-cp-eu-central-1
      AutoScalingGroupProvider:
        AutoScalingGroupArn: !GetAtt Ec2AutoScalingGroup.AutoScalingGroupARN
        ManagedScaling:
          MaximumScalingStepSize: 1
          MinimumScalingStepSize: 1
          InstanceWarmupPeriod: 300
          Status: ENABLED
          TargetCapacity: 100
        ManagedTerminationProtection: ENABLED
        ManagedDraining: ENABLED
      Tags:
        - Key: Name
          Value: !Sub fit-track-${Environment}-ecs-cp-eu-central-1
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: fit-track
        - Key: Component
          Value: compute

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub fit-track-${Environment}-ecs-cluster-eu-central-1
      Tags:
        - Key: Name
          Value: !Sub fit-track-${Environment}-ecs-cluster-eu-central-1
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: fit-track
        - Key: Component
          Value: compute

  EcsCapacityProviderAssociations:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Properties:
      CapacityProviders:
        - !Ref EcsCapacityProvider
      Cluster: !Ref EcsCluster
      DefaultCapacityProviderStrategy:
        - CapacityProvider: !Ref EcsCapacityProvider
          Weight: 1

Outputs:
  EcsClusterName:
    Description: Name of the ECS cluster for service stacks.
    Value: !Ref EcsCluster
    Export:
      Name: !Sub "fit-track-${Environment}-compute-EcsClusterName"
  EcsClusterArn:
    Description: ARN of the ECS cluster for service stacks.
    Value: !GetAtt EcsCluster.Arn
    Export:
      Name: !Sub "fit-track-${Environment}-compute-EcsClusterArn"
  EcsCapacityProviderName:
    Description: Name of the ECS capacity provider associated with the cluster.
    Value: !Ref EcsCapacityProvider
    Export:
      Name: !Sub "fit-track-${Environment}-compute-EcsCapacityProviderName"
  EcsInstanceSecurityGroupId:
    Description: Security group ID for ECS container instances.
    Value: !GetAtt EcsInstanceSecurityGroup.GroupId
    Export:
      Name: !Sub "fit-track-${Environment}-compute-EcsInstanceSecurityGroupId"
  EcsAutoScalingGroupName:
    Description: Name of the EC2 Auto Scaling group providing ECS capacity.
    Value: !Ref Ec2AutoScalingGroup
    Export:
      Name: !Sub "fit-track-${Environment}-compute-EcsAutoScalingGroupName"
