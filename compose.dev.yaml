name: fit-track-dev

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.dev}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - type: volume
        source: postgres_dev_data
        target: /var/lib/postgresql/data
    networks:
      - development
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migration:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migration
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
    volumes:
      - type: bind
        source: ./backend/prisma
        target: /user/src/app/backend/prisma
        read_only: true
    networks:
      - development
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    init: true
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      DB_POOL_MAX: ${DB_POOL_MAX:-5}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-30000}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.dev}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"
    volumes:
      - type: bind
        source: ./backend/src
        target: /user/src/app/backend/src
        read_only: true
    networks:
      - development
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    init: true
    environment:
      VITE_API_BASE_PATH: ${VITE_API_BASE_PATH:-/api}
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:3001}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - type: bind
        source: ./frontend/src
        target: /user/src/app/frontend/src
        read_only: true
      - type: bind
        source: ./frontend/public
        target: /user/src/app/frontend/public
        read_only: true
    networks:
      - development
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Set PGADMIN_EMAIL in .env.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env.dev}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - type: volume
        source: pgadmin_dev_data
        target: /var/lib/pgadmin
    networks:
      - development
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_dev_data:
    name: fit-track-dev-postgres-data

  pgadmin_dev_data:
    name: fit-track-dev-pgadmin-data

networks:
  development:
    name: fit-track-dev-network
