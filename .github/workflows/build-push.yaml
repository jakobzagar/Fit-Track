name: Build and Push to GHCR

on:
  workflow_run:
    workflows:
      - Test
    branches:
      - main
    types:
      - completed

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push images
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      REGISTRY: ghcr.io
      BACKEND_IMAGE: ${{ github.repository_owner }}/fit-track-backend
      FRONTEND_IMAGE: ${{ github.repository_owner }}/fit-track-frontend
      MIGRATION_IMAGE: ${{ github.repository_owner }}/fit-track-migration

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        id: backend
        uses: ./.github/actions/build-container
        with:
          image: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          dockerfile: backend/Dockerfile
          cache-scope: backend
          revision: ${{ github.event.workflow_run.head_sha }}
          tags: |
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}

      - name: Build and push frontend image
        id: frontend
        uses: ./.github/actions/build-container
        with:
          image: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          dockerfile: frontend/Dockerfile
          cache-scope: frontend
          revision: ${{ github.event.workflow_run.head_sha }}
          tags: |
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}

      - name: Build and push migration image
        id: migration
        uses: ./.github/actions/build-container
        with:
          image: ${{ env.REGISTRY }}/${{ env.MIGRATION_IMAGE }}
          dockerfile: backend/Dockerfile
          target: migration
          cache-scope: migration
          revision: ${{ github.event.workflow_run.head_sha }}
          tags: |
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}

      - name: Smoke test production containers
        env:
          BACKEND_IMAGE: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}@${{ steps.backend.outputs.digest }}
          FRONTEND_IMAGE: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}@${{ steps.frontend.outputs.digest }}
          MIGRATION_IMAGE: ${{ env.REGISTRY }}/${{ env.MIGRATION_IMAGE }}@${{ steps.migration.outputs.digest }}
        run: npm run smoke:production

      - name: Promote images to main
        shell: bash
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          MIGRATION_DIGEST: ${{ steps.migration.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag "$REGISTRY/$BACKEND_IMAGE:main" \
            "$REGISTRY/$BACKEND_IMAGE@$BACKEND_DIGEST"

          docker buildx imagetools create \
            --tag "$REGISTRY/$FRONTEND_IMAGE:main" \
            "$REGISTRY/$FRONTEND_IMAGE@$FRONTEND_DIGEST"

          docker buildx imagetools create \
            --tag "$REGISTRY/$MIGRATION_IMAGE:main" \
            "$REGISTRY/$MIGRATION_IMAGE@$MIGRATION_DIGEST"
