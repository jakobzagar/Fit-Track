name: Test

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Actions lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        shell: bash
        run: |
          archive="$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"

          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"

          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint

      - name: Lint GitHub Actions workflows
        run: |
          "$RUNNER_TEMP/actionlint" -color

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          show-patched-versions: true

  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
      JWT_SECRET: fit-track-test-secret-that-is-at-least-32-characters
      CLIENT_ORIGIN: http://localhost:5173
      TRUST_PROXY_HOPS: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Verify
        run: npm run verify

  integration:
    name: Integration
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fit_track_test
          POSTGRES_PASSWORD: fit_track_test_password
          POSTGRES_DB: fit_track_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fit_track_test -d fit_track_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://fit_track_test:fit_track_test_password@localhost:5432/fit_track_test
      JWT_SECRET: fit-track-test-secret-that-is-at-least-32-characters
      CLIENT_ORIGIN: http://localhost:5173
      TRUST_PROXY_HOPS: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Build shared contracts
        run: npm run build:shared

      - name: Generate Prisma client
        run: npm run generate --workspace @fit-track/backend

      - name: Apply database migrations
        run: npm exec --workspace @fit-track/backend -- prisma migrate deploy

      - name: Run backend integration tests
        run: npm run test:integration

  browser-e2e:
    name: Browser E2E
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Install Chromium
        run: npm exec --workspace @fit-track/frontend -- playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-artifacts
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  container-smoke:
    name: Production container smoke
    needs: verify
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build backend production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/Dockerfile
          target: production
          load: true
          tags: fit-track-backend:smoke
          provenance: false
          sbom: false
          cache-from: type=gha,scope=smoke-backend
          cache-to: type=gha,mode=max,scope=smoke-backend

      - name: Build migration image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/Dockerfile
          target: migration
          load: true
          tags: fit-track-migration:smoke
          provenance: false
          sbom: false
          cache-from: type=gha,scope=smoke-backend

      - name: Build frontend production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: frontend/Dockerfile
          target: production
          load: true
          tags: fit-track-frontend:smoke
          provenance: false
          sbom: false
          cache-from: type=gha,scope=smoke-frontend
          cache-to: type=gha,mode=max,scope=smoke-frontend

      - name: Smoke test production containers
        run: npm run smoke:production
