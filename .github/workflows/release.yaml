name: Release Images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-images:
    name: Promote and publish release images
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write

    env:
      REGISTRY: ghcr.io
      BACKEND_IMAGE: ${{ github.repository_owner }}/fit-track-backend
      FRONTEND_IMAGE: ${{ github.repository_owner }}/fit-track-frontend
      MIGRATION_IMAGE: ${{ github.repository_owner }}/fit-track-migration

    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release
        id: release
        shell: bash
        run: bash scripts/release/validate.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for verified main images
        id: images
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/wait-for-images.sh

      - name: Smoke test release images
        env:
          BACKEND_IMAGE: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}@${{ steps.images.outputs.backend-digest }}
          FRONTEND_IMAGE: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}@${{ steps.images.outputs.frontend-digest }}
          MIGRATION_IMAGE: ${{ env.REGISTRY }}/${{ env.MIGRATION_IMAGE }}@${{ steps.images.outputs.migration-digest }}
        run: bash scripts/smoke/production-containers.sh

      - name: Assume AWS ECR publish role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "126571942046"
          role-session-name: fit-track-ecr-${{ github.run_id }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Copy release images to ECR
        id: ecr-images
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          VERSION: ${{ steps.release.outputs.version }}
          BACKEND_DIGEST: ${{ steps.images.outputs.backend-digest }}
          MIGRATION_DIGEST: ${{ steps.images.outputs.migration-digest }}
        run: bash scripts/release/copy-images-to-ecr.sh

      - name: Promote release images
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          BACKEND_REF: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}@${{ steps.images.outputs.backend-digest }}
          FRONTEND_REF: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}@${{ steps.images.outputs.frontend-digest }}
          MIGRATION_REF: ${{ env.REGISTRY }}/${{ env.MIGRATION_IMAGE }}@${{ steps.images.outputs.migration-digest }}
        run: >-
          bash scripts/release/promote-images.sh
          "$VERSION"
          "$BACKEND_REF"
          "$FRONTEND_REF"
          "$MIGRATION_REF"
