name: Release Images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}

    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release
        id: release
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags
          bash scripts/release/validate.sh "$GITHUB_REF_NAME" origin/main >> "$GITHUB_OUTPUT"

  promote-images:
    name: Promote images
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      BACKEND_IMAGE: ${{ github.repository_owner }}/fit-track-backend
      FRONTEND_IMAGE: ${{ github.repository_owner }}/fit-track-frontend
      MIGRATION_IMAGE: ${{ github.repository_owner }}/fit-track-migration

    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote release images
        shell: bash
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
          REVISION: ${{ needs.validate-release.outputs.revision }}
        run: |
          bash scripts/release/promote-images.sh \
            "$VERSION" \
            "$REVISION" \
            "$REGISTRY/$BACKEND_IMAGE" \
            "$REGISTRY/$FRONTEND_IMAGE" \
            "$REGISTRY/$MIGRATION_IMAGE"
