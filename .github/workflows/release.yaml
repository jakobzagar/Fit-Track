name: Release Images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-images:
    name: Build and publish release images
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      BACKEND_IMAGE: ${{ github.repository_owner }}/fit-track-backend
      FRONTEND_IMAGE: ${{ github.repository_owner }}/fit-track-frontend
      MIGRATION_IMAGE: ${{ github.repository_owner }}/fit-track-migration

    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read release version
        id: release
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production images
        id: images
        uses: ./.github/actions/build-production-images
        with:
          revision: ${{ github.sha }}

      - name: Smoke test release images
        env:
          BACKEND_IMAGE: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}@${{ steps.images.outputs.backend-digest }}
          FRONTEND_IMAGE: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}@${{ steps.images.outputs.frontend-digest }}
          MIGRATION_IMAGE: ${{ env.REGISTRY }}/${{ env.MIGRATION_IMAGE }}@${{ steps.images.outputs.migration-digest }}
        run: bash scripts/smoke/production-containers.sh

      - name: Promote release images
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          BACKEND_REF: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}@${{ steps.images.outputs.backend-digest }}
          FRONTEND_REF: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}@${{ steps.images.outputs.frontend-digest }}
          MIGRATION_REF: ${{ env.REGISTRY }}/${{ env.MIGRATION_IMAGE }}@${{ steps.images.outputs.migration-digest }}
        run: |
          docker buildx imagetools create \
            --tag "$REGISTRY/$BACKEND_IMAGE:$VERSION" \
            --tag "$REGISTRY/$BACKEND_IMAGE:latest" \
            "$BACKEND_REF"

          docker buildx imagetools create \
            --tag "$REGISTRY/$FRONTEND_IMAGE:$VERSION" \
            --tag "$REGISTRY/$FRONTEND_IMAGE:latest" \
            "$FRONTEND_REF"

          docker buildx imagetools create \
            --tag "$REGISTRY/$MIGRATION_IMAGE:$VERSION" \
            --tag "$REGISTRY/$MIGRATION_IMAGE:latest" \
            "$MIGRATION_REF"
