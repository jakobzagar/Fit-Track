name: fit-track-production-smoke

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fit_track_smoke
      POSTGRES_PASSWORD: fit_track_smoke_password
      POSTGRES_DB: fit_track_smoke
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - smoke
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
    restart: "no"

  migration:
    image: ${MIGRATION_IMAGE:-fit-track-migration:smoke}
    environment:
      DATABASE_URL: postgresql://fit_track_smoke:fit_track_smoke_password@database:5432/fit_track_smoke
    networks:
      - smoke
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  backend:
    image: ${BACKEND_IMAGE:-fit-track-backend:smoke}
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://fit_track_smoke:fit_track_smoke_password@database:5432/fit_track_smoke
      DATABASE_TLS_MODE: allow-insecure
      DB_POOL_MAX: 5
      DB_CONNECTION_TIMEOUT_MS: 5000
      DB_IDLE_TIMEOUT_MS: 30000
      LOG_LEVEL: info
      JWT_SECRET: fit-track-production-smoke-secret-that-is-at-least-32-characters
      CLIENT_ORIGIN: http://localhost:${SMOKE_FRONTEND_PORT:-18080}
      TRUST_PROXY_HOPS: "1"
    ports:
      - "127.0.0.1:${SMOKE_BACKEND_PORT:-13001}:3001"
    networks:
      - smoke
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: "no"

  frontend:
    image: ${FRONTEND_IMAGE:-fit-track-frontend:smoke}
    ports:
      - "127.0.0.1:${SMOKE_FRONTEND_PORT:-18080}:8080"
    networks:
      - smoke
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"

networks:
  smoke:
    name: fit-track-production-smoke-network
